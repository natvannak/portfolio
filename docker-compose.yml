# Docker Swarm stack file (used by Jenkins: docker stack deploy)
# Keep docker-compose.yml for local development.
services:
  app:
    image: ${DOCKERHUB_REPO}:${IMAGE_TAG}
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: portfoliodb
      DB_USERNAME: portfolio
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - portfolio_network
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure

  nginx:
    image: ${DOCKERHUB_REPO}:nginx-${IMAGE_TAG}
    ports:
      - "80:80"
    networks:
      - portfolio_network
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: portfoliodb
      MYSQL_USER: portfolio
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - portfolio_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

networks:
  portfolio_network:
    driver: overlay

volumes:
  mysql_data: