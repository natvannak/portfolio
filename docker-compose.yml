services:

  app:
    image: ${APP_IMAGE}
    networks:
      - portfolio_network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  nginx:
    image: ${NGINX_IMAGE}

    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress

    networks:
      - portfolio_network

    depends_on:
      - app

    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  db:
    image: mysql:8.4

    environment:
      MYSQL_DATABASE: portfolio
      MYSQL_USER: portfolio
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - portfolio_network

    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

networks:
  portfolio_network:
    driver: overlay

volumes:
  mysql_data: